name: Backend Tests

on:
  push:
    branches: [main, develop]
    # paths:
    #   - 'src/**'  # make sure to only run if the backend src is changed
    # Todo: Uncomment if this workflow works
  pull_request:
    branches: [main, develop]

jobs:
  pytest-job:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      # Setup uv 
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: ./src
        run: uv sync

      - name: Run tests
        working-directory: ./src
        env:
          ENV: TEST
          DB_URL: ${{ secrets.DB_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: uv run pytest -v