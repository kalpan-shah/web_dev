[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.135.1",
    "websockets>=16.0",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "httpx (<0.28.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"