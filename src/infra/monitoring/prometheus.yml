global:
  scrape_interval: 7s

scrape_configs:
  - job_name: "web_app"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["web:8000"]
  
  - job_name: 'web-otel-collector'
    static_configs:
      - targets: ['web-otel-collector:8889'] 

  - job_name: 'locust-legacy'
    static_configs:
      - targets: ['web-locust-exporter:9646']