services:
  web:
    # build: .
    image: todo-app:latest
    container_name: todo_app
    ports:
      - "8000:8000"
    networks:
      - todo_network 
    env_file:
      - .env
    # command: >
    #   sh -c "
    #   echo 'Waiting for remote database...';
    #   until pg_isready -h $$LOCAL_DB_HOST -p $$LOCAL_DB_PORT -U $$LOCAL_DB_USER; do
    #     sleep 1;
    #   done;
    #   echo 'Database is ready! Starting application...';
    #   uv run app.main:app --host 0.0.0.0 --port 8000
    #   "

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    networks:
      - todo_network
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus


  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - todo_network
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    networks:
      - todo_network
    ports:
      - "16686:16686" # Jaeger UI
    #   - "4317:4317"  # OTLP gRPC receiver (if bypassing collector)
    
    # environment:
    #   - SPAN_STORAGE_TYPE=badger # Changes storage from memory to Badger
    #   - BADGER_DIRECTORY_VALUE=/badger/data
    #   - BADGER_EPHEMERAL=false
    # volumes:
    #   - jaeger-data:/badger/data # Attaching volume for persistence

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/monitoring/otel-config.yaml:/etc/otelcol/config.yaml
    ports:
      - "4318:4318" # OTLP HTTP receiver
      - "4317:4317" # OTLP gRPC receiver
    depends_on:
      - jaeger
    networks:
      - todo_network

networks:
  todo_network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-storage:
  # jaeger-data:
  